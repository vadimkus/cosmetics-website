<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- iPhone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="40" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="240" height="460" rx="35" fill="#fff"/>
  
  <!-- Notch -->
  <rect x="90" y="20" width="100" height="30" rx="15" fill="#1a1a1a"/>
  
  <!-- Share Sheet Background -->
  <rect x="20" y="200" width="240" height="280" rx="20" fill="#f5f5f5"/>
  
  <!-- Share Sheet Handle -->
  <rect x="120" y="210" width="40" height="5" rx="2.5" fill="#ccc"/>
  
  <!-- Share Options Row -->
  <g transform="translate(50, 240)">
    <circle r="25" fill="#007AFF"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="20" fill="#fff">✉</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#333">Message</text>
  </g>
  <g transform="translate(110, 240)">
    <circle r="25" fill="#34C759"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="20" fill="#fff">📋</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#333">Copy</text>
  </g>
  <g transform="translate(170, 240)">
    <circle r="25" fill="#5856D6"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="20" fill="#fff">📖</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#333">Books</text>
  </g>
  <g transform="translate(230, 240)">
    <circle r="25" fill="#FF9500"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="20" fill="#fff">📝</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui" font-size="9" fill="#333">Notes</text>
  </g>
  
  <!-- Divider -->
  <line x1="35" y1="310" x2="245" y2="310" stroke="#ddd" stroke-width="1"/>
  
  <!-- Add to Home Screen Option (highlighted) -->
  <rect x="35" y="320" width="210" height="50" rx="10" fill="#dc2626" opacity="0.1" stroke="#dc2626" stroke-width="2"/>
  <g transform="translate(55, 345)">
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#333" stroke-width="1.5"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="80" y="350" font-family="system-ui" font-size="14" fill="#333">Add to Home Screen</text>
  
  <!-- Arrow pointing to option -->
  <path d="M250 345 L260 345" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <polygon points="265,345 255,340 255,350" fill="#dc2626"/>
  
  <!-- More options -->
  <rect x="35" y="380" width="210" height="40" rx="8" fill="#fff"/>
  <text x="55" y="405" font-family="system-ui" font-size="12" fill="#666">Add Bookmark</text>
  
  <rect x="35" y="425" width="210" height="40" rx="8" fill="#fff"/>
  <text x="55" y="450" font-family="system-ui" font-size="12" fill="#666">Add to Favorites</text>
</svg>


