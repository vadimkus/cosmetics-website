<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- Android Phone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="18" y="18" width="244" height="464" rx="25" fill="#fff"/>
  
  <!-- Status Bar -->
  <rect x="18" y="18" width="244" height="28" fill="#22c55e"/>
  <text x="30" y="36" font-family="system-ui" font-size="10" fill="#fff">9:41</text>
  <text x="230" y="36" font-family="system-ui" font-size="10" fill="#fff">⚡ 85%</text>
  
  <!-- Chrome Tab Bar -->
  <rect x="18" y="46" width="244" height="50" fill="#f5f5f5"/>
  
  <!-- Tab -->
  <rect x="25" y="52" width="140" height="38" rx="8" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="40" cy="71" r="8" fill="#dc2626"/>
  <text x="40" y="75" text-anchor="middle" font-family="system-ui" font-size="10" fill="#fff">G</text>
  <text x="95" y="75" text-anchor="middle" font-family="system-ui" font-size="10" fill="#333">Genosys</text>
  
  <!-- Chrome Icon (highlighted) -->
  <circle cx="140" cy="20" r="50" fill="#22c55e" opacity="0.15"/>
  
  <!-- URL Bar -->
  <rect x="25" y="100" width="230" height="36" rx="18" fill="#f0f0f0"/>
  <circle cx="45" cy="118" r="10" fill="#22c55e"/>
  <text x="45" y="122" text-anchor="middle" font-family="system-ui" font-size="10" fill="#fff">🔒</text>
  <text x="140" y="122" text-anchor="middle" font-family="system-ui" font-size="11" fill="#333">genosys.ae</text>
  
  <!-- Content Area -->
  <rect x="25" y="145" width="230" height="280" rx="15" fill="#fef2f2"/>
  
  <!-- Genosys Logo -->
  <rect x="90" y="165" width="100" height="40" rx="8" fill="#dc2626"/>
  <text x="140" y="190" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#fff">GENOSYS</text>
  
  <!-- Chrome Logo -->
  <g transform="translate(140, 350)">
    <circle r="35" fill="#fff" stroke="#e0e0e0" stroke-width="2"/>
    <circle r="12" fill="#4285f4"/>
    <path d="M-30 0 A30 30 0 0 1 0 -30" stroke="#ea4335" stroke-width="8" fill="none"/>
    <path d="M0 -30 A30 30 0 0 1 26 15" stroke="#fbbc05" stroke-width="8" fill="none"/>
    <path d="M26 15 A30 30 0 0 1 -30 0" stroke="#34a853" stroke-width="8" fill="none"/>
  </g>
  
  <!-- Instruction -->
  <text x="140" y="420" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333" font-weight="600">Open in Chrome browser</text>
  <text x="140" y="440" text-anchor="middle" font-family="system-ui" font-size="10" fill="#666">for best installation experience</text>
</svg>


