<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- Android Phone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="18" y="18" width="244" height="464" rx="25" fill="#fff"/>
  
  <!-- Status Bar -->
  <rect x="18" y="18" width="244" height="28" fill="#22c55e"/>
  
  <!-- Dropdown Menu -->
  <rect x="100" y="50" width="160" height="380" rx="8" fill="#fff" filter="url(#shadow)"/>
  
  <!-- Menu Items -->
  <g font-family="system-ui" font-size="12" fill="#333">
    <text x="120" y="80">New tab</text>
    <text x="120" y="110">New Incognito tab</text>
    <text x="120" y="140">History</text>
    <text x="120" y="170">Downloads</text>
    <text x="120" y="200">Bookmarks</text>
  </g>
  
  <!-- Divider -->
  <line x1="110" y1="215" x2="250" y2="215" stroke="#eee"/>
  
  <!-- Install App Option (highlighted) -->
  <rect x="105" y="225" width="150" height="40" rx="5" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="2"/>
  <g transform="translate(125, 245)">
    <rect x="-8" y="-10" width="20" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M2 -4 L2 2 M-2 -1 L2 2 L6 -1" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
  <text x="145" y="250" font-family="system-ui" font-size="12" fill="#22c55e" font-weight="600">Install app</text>
  
  <!-- Arrow pointing to option -->
  <path d="M80 245 L95 245" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="100,245 90,240 90,250" fill="#22c55e"/>
  
  <!-- More menu items -->
  <g font-family="system-ui" font-size="12" fill="#333">
    <text x="120" y="290">Add to Home screen</text>
    <line x1="110" y1="305" x2="250" y2="305" stroke="#eee"/>
    <text x="120" y="330">Desktop site</text>
    <text x="120" y="360">Translate...</text>
    <text x="120" y="390">Settings</text>
    <text x="120" y="420">Help &amp; feedback</text>
  </g>
  
  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>

