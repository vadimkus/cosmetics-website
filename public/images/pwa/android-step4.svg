<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- Android Phone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="18" y="18" width="244" height="464" rx="25" fill="#fff"/>
  
  <!-- Status Bar -->
  <rect x="18" y="18" width="244" height="28" fill="#22c55e"/>
  
  <!-- Blurred background -->
  <rect x="18" y="46" width="244" height="436" fill="#f0f0f0" opacity="0.5"/>
  
  <!-- Install Dialog -->
  <rect x="40" y="150" width="200" height="200" rx="15" fill="#fff" filter="url(#shadow2)"/>
  
  <!-- App Icon -->
  <rect x="100" y="170" width="80" height="80" rx="20" fill="#dc2626"/>
  <text x="140" y="220" text-anchor="middle" font-family="system-ui" font-size="32" fill="#fff" font-weight="bold">G</text>
  
  <!-- App Name -->
  <text x="140" y="275" text-anchor="middle" font-family="system-ui" font-size="16" fill="#333" font-weight="600">Genosys</text>
  <text x="140" y="295" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">genosys.ae</text>
  
  <!-- Install Button (highlighted) -->
  <rect x="60" y="310" width="160" height="45" rx="22" fill="#22c55e"/>
  <text x="140" y="340" text-anchor="middle" font-family="system-ui" font-size="14" fill="#fff" font-weight="600">Install</text>
  
  <!-- Pulsing ring around install button -->
  <rect x="55" y="305" width="170" height="55" rx="27" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  
  <!-- Arrow pointing to Install -->
  <path d="M140 360 L140 380" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="140,390 135,380 145,380" fill="#22c55e"/>
  
  <!-- Success message below -->
  <g transform="translate(140, 430)">
    <circle r="25" fill="#22c55e" opacity="0.1"/>
    <circle r="18" fill="#22c55e"/>
    <path d="M-6 0 L-2 4 L6 -4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="140" y="470" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e" font-weight="600">Tap "Install" to complete!</text>
  
  <!-- Shadow filter -->
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>


