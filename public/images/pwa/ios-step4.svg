<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- iPhone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="40" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="240" height="460" rx="35" fill="#fff"/>
  
  <!-- Notch -->
  <rect x="90" y="20" width="100" height="30" rx="15" fill="#1a1a1a"/>
  
  <!-- Add to Home Screen Dialog -->
  <rect x="30" y="80" width="220" height="200" rx="15" fill="#f5f5f5"/>
  
  <!-- Cancel & Add buttons -->
  <text x="55" y="105" font-family="system-ui" font-size="14" fill="#007AFF">Cancel</text>
  <text x="205" y="105" font-family="system-ui" font-size="14" fill="#007AFF" font-weight="600">Add</text>
  
  <!-- Divider -->
  <line x1="30" y1="120" x2="250" y2="120" stroke="#ddd"/>
  
  <!-- App Icon Preview -->
  <rect x="50" y="140" width="60" height="60" rx="15" fill="#dc2626"/>
  <text x="80" y="180" text-anchor="middle" font-family="system-ui" font-size="24" fill="#fff">G</text>
  
  <!-- App Name Input -->
  <rect x="120" y="145" width="120" height="30" rx="5" fill="#fff" stroke="#ddd"/>
  <text x="130" y="165" font-family="system-ui" font-size="12" fill="#333">Genosys</text>
  
  <!-- URL -->
  <text x="120" y="195" font-family="system-ui" font-size="10" fill="#666">genosys.ae</text>
  
  <!-- Divider -->
  <line x1="30" y1="220" x2="250" y2="220" stroke="#ddd"/>
  
  <!-- Description -->
  <text x="50" y="250" font-family="system-ui" font-size="11" fill="#666">An icon will be added to your</text>
  <text x="50" y="265" font-family="system-ui" font-size="11" fill="#666">Home Screen</text>
  
  <!-- Arrow pointing to Add button -->
  <circle cx="205" cy="100" r="25" fill="#dc2626" opacity="0.15"/>
  <path d="M205 130 L205 150" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <polygon points="205,125 200,135 210,135" fill="#dc2626"/>
  
  <!-- Success indicator at bottom -->
  <g transform="translate(140, 400)">
    <circle r="40" fill="#22c55e" opacity="0.1"/>
    <circle r="30" fill="#22c55e"/>
    <path d="M-10 0 L-3 7 L10 -6" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="140" y="460" text-anchor="middle" font-family="system-ui" font-size="12" fill="#22c55e" font-weight="600">Tap "Add" to complete!</text>
</svg>

