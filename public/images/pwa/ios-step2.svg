<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" fill="none">
  <!-- iPhone Frame -->
  <rect x="10" y="10" width="260" height="480" rx="40" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="240" height="460" rx="35" fill="#fff"/>
  
  <!-- Notch -->
  <rect x="90" y="20" width="100" height="30" rx="15" fill="#1a1a1a"/>
  
  <!-- Content Area (blurred) -->
  <rect x="35" y="70" width="210" height="300" rx="15" fill="#f9fafb" opacity="0.7"/>
  
  <!-- Bottom Toolbar -->
  <rect x="20" y="430" width="240" height="50" fill="#f5f5f5"/>
  
  <!-- Share Button (highlighted) -->
  <g transform="translate(140, 455)">
    <circle r="25" fill="#007AFF" opacity="0.15"/>
    <rect x="-10" y="-12" width="20" height="16" rx="2" fill="none" stroke="#007AFF" stroke-width="2"/>
    <path d="M0 -6 L0 -16 M-5 -11 L0 -16 L5 -11" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Pulsing Ring Animation Indicator -->
  <circle cx="140" cy="455" r="30" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Arrow pointing to Share -->
  <path d="M140 400 L140 420" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <polygon points="140,430 135,420 145,420" fill="#dc2626"/>
  
  <!-- Instruction Text -->
  <text x="140" y="380" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333" font-weight="600">Tap Share button</text>
  <text x="140" y="395" text-anchor="middle" font-family="system-ui" font-size="10" fill="#666">(square with arrow)</text>
</svg>

